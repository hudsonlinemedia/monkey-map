name: Publish Monkey Map

# One-click publish: copies the latest update from the "staging" branch to "main",
# which is what GitHub Pages serves at hudsonlinemedia.github.io/monkey-map/
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy staging to main (live site)
        run: |
          git fetch origin staging main
          git checkout -B main origin/main
          git merge --ff-only origin/staging
          git push origin main
          echo "### Published :rocket:" >> "$GITHUB_STEP_SUMMARY"
          git log -1 --pretty='%h %s' >> "$GITHUB_STEP_SUMMARY"
      - name: Ask GitHub Pages to rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || echo "Pages will rebuild on its own"
